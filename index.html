<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RobloxFlow — Google Flow Prompt Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        // Configure Tailwind CSS for mobile-first dark crimson & luminous white theme
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        obsidian: '#060608',
                        panel: '#0e0e12',
                        surface: '#15151b',
                        crimson: '#dc2626',
                        crimsonBright: '#ef4444',
                    }
                }
            }
        };
    </script>
    <style>
        /* Lock root and body strictly to 100dvh with zero page scrolling */
        html, body {
            height: 100dvh;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #060608;
            color: #ffffff;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* Allow text selection inside the generated prompt text */
        .prompt-selectable {
            user-select: text;
            -webkit-user-select: text;
        }

        /* GPU-only smooth animations (transform & opacity only for zero lag) */
        @keyframes spinRingClockwise {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes spinRingCounter {
            0% {
                transform: rotate(360deg);
            }
            100% {
                transform: rotate(0deg);
            }
        }

        @keyframes pulseAura {
            0%, 100% {
                transform: translate3d(-50%, -50%, 0) scale(0.95);
                opacity: 0.45;
            }
            50% {
                transform: translate3d(-50%, -50%, 0) scale(1.06);
                opacity: 0.78;
            }
        }

        @keyframes driftLightBeam {
            0% {
                transform: translate3d(-35%, -20%, 0) rotate(-18deg);
                opacity: 0.14;
            }
            50% {
                transform: translate3d(15%, 10%, 0) rotate(-18deg);
                opacity: 0.28;
            }
            100% {
                transform: translate3d(-35%, -20%, 0) rotate(-18deg);
                opacity: 0.14;
            }
        }

        @keyframes riseLightParticle {
            0% {
                transform: translate3d(0, 0, 0) scale(0.75);
                opacity: 0;
            }
            18% {
                opacity: 0.85;
            }
            82% {
                opacity: 0.55;
            }
            100% {
                transform: translate3d(12px, -105dvh, 0) scale(1.15);
                opacity: 0;
            }
        }

        @keyframes buttonShimmerSlide {
            0% {
                transform: translate3d(-130%, 0, 0) skewX(-20deg);
            }
            100% {
                transform: translate3d(240%, 0, 0) skewX(-20deg);
            }
        }

        @keyframes pillActivePulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.025);
            }
        }

        .ring-cw {
            animation: spinRingClockwise 1.25s linear infinite;
            will-change: transform;
        }

        .ring-ccw {
            animation: spinRingCounter 1.9s linear infinite;
            will-change: transform;
        }

        /* Luminous white radial glow behind the main interface */
        .white-radial-glow {
            position: fixed;
            top: 46%;
            left: 50%;
            width: min(92vw, 440px);
            height: min(72dvh, 520px);
            border-radius: 9999px;
            background: radial-gradient(
                circle,
                rgba(255, 255, 255, 0.20) 0%,
                rgba(255, 255, 255, 0.08) 42%,
                rgba(220, 38, 38, 0.07) 68%,
                rgba(6, 6, 8, 0) 100%
            );
            pointer-events: none;
            z-index: 1;
            animation: pulseAura 5.2s ease-in-out infinite;
            will-change: transform, opacity;
        }

        /* Drifting diagonal white light beam */
        .white-light-beam {
            position: fixed;
            top: -15%;
            left: -25%;
            width: 150vw;
            height: 24dvh;
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.14) 48%,
                rgba(255, 255, 255, 0.24) 50%,
                rgba(255, 255, 255, 0.12) 52%,
                rgba(255, 255, 255, 0) 100%
            );
            pointer-events: none;
            z-index: 1;
            animation: driftLightBeam 8.5s ease-in-out infinite;
            will-change: transform, opacity;
        }

        /* Rising white & crimson light particles */
        .light-particle {
            position: fixed;
            bottom: -14px;
            border-radius: 9999px;
            pointer-events: none;
            z-index: 2;
            will-change: transform, opacity;
            animation: riseLightParticle linear infinite;
        }

        /* Shimmer sweep on the primary RANDOMIZE PROMPT button */
        .shimmer-btn {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #ffffff 0%, #ffe4e6 34%, #ef4444 68%, #b91c1c 100%);
            box-shadow: 0 8px 26px rgba(220, 38, 38, 0.42), 0 0 18px rgba(255, 255, 255, 0.25);
            transition: transform 0.16s ease, box-shadow 0.2s ease;
            will-change: transform;
        }

        .shimmer-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 48%;
            height: 100%;
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.72) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            animation: buttonShimmerSlide 2.6s ease-in-out infinite;
            pointer-events: none;
            will-change: transform;
        }

        .shimmer-btn:active {
            transform: scale(0.97);
        }

        .pill-selected {
            animation: pillActivePulse 2.4s ease-in-out infinite;
            will-change: transform;
        }

        /* Subtle custom scrollbar inside the prompt generator box */
        .prompt-scroll::-webkit-scrollbar {
            width: 4px;
        }

        .prompt-scroll::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 9999px;
        }

        .prompt-scroll::-webkit-scrollbar-thumb {
            background: rgba(239, 68, 68, 0.55);
            border-radius: 9999px;
        }
    </style>
</head>

    <script>
        (function () {
            'use strict';

            const GOOGLE_FLOW_URL = 'https://labs.google/fx/tools/flow';

            // Forbidden words guard to ensure generated prompts never contain dog, cat, iro, or ering
            const FORBIDDEN_PATTERN = /\b(dog|dogs|cat|cats|iro|ering)\b/i;

            // Settings centered on In This Town and In This World
            const TOPIC_SCENES = {
                'All Around The World': [
                    'in a bustling sunlit plaza in this world with colorful flags fluttering in the breeze',
                    'along a lively coastal promenade in this world under bright afternoon sunlight',
                    'beside a busy fountain square in this world filled with travelers and street music'
                ],

                    'right down the main street of this town lined with cozy shops and warm morning light',
                    'at the lively town crossroads of this town with classic streetlights and cheerful energy',
                    'in front of the town clocktower in this town during golden hour'

                'Downtown Square': [
                    'in the center of downtown square in this town surrounded by cafes and bright signage',
                    'across the paved courtyard of downtown square in this town under clear blue skies',
                    'near the central monument of downtown square in this town with crisp daylight'
                ],
                'World Landmarks': [
                    'with iconic grand arches and historic stone columns of famous world landmarks in the background',
                    'in front of towering international monuments and scenic plazas across this world',
                    'at a famous global overlook featuring renowned architectural landmarks in clear daylight'
                ],
                'Neighborhood Corner': [
                    'at a friendly neighborhood corner in this town with shady trees and tidy walkways',
                    'outside a welcoming corner bakery on a quiet neighborhood street in this town',
                    'along a sunny neighborhood sidewalk in this town with warm community vibes'
                ],
                'Global Metropolis': [
                    'amidst sleek glass skyscrapers and busy avenues of a global metropolis in this world',
                    'on a wide elevated walkway in a vibrant global metropolis with bright city lights',
                    'beside a bustling transit plaza in a modern global metropolis full of motion'
                ],
                'Small Town Market': [
                    'between vibrant fruit stalls and canvas canopies at a small town market in this town',
                    'along a lively outdoor vendor lane at a small town market in this town',
                    'near fresh produce crates and warm bunting at a small town market in this town'
                ],
                'World Tour Chaos': [
                    'in the middle of an energetic street parade during a wild world tour across this world',
                    'along a festive avenue bursting with confetti and lively crowds on a world tour',
                    'at a high-energy festival square in this world filled with playful commotion'
                ]
            };

            // Two lively animal companions standing side by side, laughing hysterically, and pointing directly at the camera lens
            const COMPANION_DUOS = [
                'two lively animal companions standing side by side, a golden-furred pup-like pal and a sleek whiskered feline-like buddy, both laughing hysterically with wide open mouths and crinkled happy eyes while pointing directly at the camera lens with raised paws',
                'two lively animal companions standing side by side, a spotted snouted buddy and a velvety charcoal whiskered pal, both laughing hysterically in uncontrollable belly laughs while pointing directly at the camera lens with energetic paws',
                'two lively animal companions standing side by side, a russet-coated sidekick and a striped whiskered friend, both laughing hysterically with bright joyful expressions while pointing directly at the camera lens with expressive paws',
                'two lively animal companions standing side by side, a fluffy cream-colored buddy and a smoky slate whiskered pal, both laughing hysterically with huge grins while pointing directly at the camera lens with lively paws'
            ];

            // Camera & Google Flow video direction details
            const CAMERA_DIRECTIONS = [
                'Dynamic medium-close camera framing, crisp 4K photorealistic motion, natural depth of field, vibrant colors, smooth fluid movement, no text or watermarks.',
                'Eye-level tracking shot with subtle push-in, sharp detail, bright natural lighting, smooth high-frame-rate video clarity, no text or watermarks.',
                'Lively handheld comedic shot keeping both laughing pointing companions sharply in focus against the scene, clean Google Flow video quality, no text or watermarks.'
            ];

            // DOM Element References
            const loadingScreen = document.getElementById('loadingScreen');
            const loaderBarFill = document.getElementById('loaderBarFill');
            const loaderPercentText = document.getElementById('loaderPercentText');
            const loaderStatusText = document.getElementById('loaderStatusText');
            const mainApp = document.getElementById('mainApp');
            const particlesContainer = document.getElementById('particlesContainer');
            const topicPills = Array.from(document.querySelectorAll('.topic-pill'));
            const activeTopicLabel = document.getElementById('activeTopicLabel');
            const randomizeBtn = document.getElementById('randomizeBtn');
            const promptTextEl = document.getElementById('promptText');
            const statusBanner = document.getElementById('statusBanner');
            const copyPromptBtn = document.getElementById('copyPromptBtn');
            const copyAndOpenFlowBtn = document.getElementById('copyAndOpenFlowBtn');

            let selectedTopic = 'All Around The World';
            let statusTimeout = null;

            // Pick a random item from a non-empty array
            function pickRandom(list) {
                return list[Math.floor(Math.random() * list.length)];
            }

            // Show subtle inline notification without using alert() or confirm()
            function showStatus(message) {
                if (!statusBanner) return;
                clearTimeout(statusTimeout);
                statusBanner.textContent = message;
                statusBanner.classList.remove('hidden');
                statusTimeout = setTimeout(() => {
                    statusBanner.classList.add('hidden');
                }, 2200);
            }

            // Build a Google Flow prompt strictly meeting all requirements
            function generateFlowPrompt(topic) {
                const scenes = TOPIC_SCENES[topic] || TOPIC_SCENES['All Around The World'];
                const scene = pickRandom(scenes);
                const duo = pickRandom(COMPANION_DUOS);
                const camera = pickRandom(CAMERA_DIRECTIONS);

                let assembled = `Google Flow video prompt (${topic}): Set ${scene}, featuring ${duo}. Both lively animal companions stand side by side, laughing hysterically while pointing directly at the camera lens. ${camera}`;

                // Safeguard to guarantee forbidden terms never appear
                if (FORBIDDEN_PATTERN.test(assembled)) {
                    assembled = assembled.replace(FORBIDDEN_PATTERN, 'companion');
                }

                return assembled;
            }

            // Render a newly randomized prompt into the generator box
            function renderNewPrompt() {
                try {
                    promptTextEl.textContent = generateFlowPrompt(selectedTopic);
                } catch (err) {
                    promptTextEl.textContent = 'Google Flow video prompt (In This Town): Set right down the main street of this town in warm daylight, featuring two lively animal companions standing side by side, laughing hysterically while pointing directly at the camera lens with raised paws. Crisp 4K photorealistic motion, no text or watermarks.';
                }
            }

            // Copy text reliably using execCommand fallback for iFrame environments
            function copyToClipboard(text, callback) {
                try {
                    const tempArea = document.createElement('textarea');
                    tempArea.value = text;
                    tempArea.setAttribute('readonly', '');
                    tempArea.style.position = 'fixed';
                    tempArea.style.top = '-9999px';
                    tempArea.style.left = '-9999px';
                    document.body.appendChild(tempArea);
                    tempArea.select();
                    tempArea.setSelectionRange(0, tempArea.value.length);
                    const ok = document.execCommand('copy');
                    document.body.removeChild(tempArea);
                    if (callback) callback(Boolean(ok));
                } catch (err) {
                    if (callback) callback(false);
                }
            }

            // Initialize lightweight rising white and crimson light particles
            function initParticles() {
                if (!particlesContainer) return;
                const totalParticles = 14;
                for (let i = 0; i < totalParticles; i++) {
                    const dot = document.createElement('span');
                    dot.className = 'light-particle';
                    const size = 4 + (i % 4) * 2;
                    const leftPercent = Math.round(((i + 0.5) / totalParticles) * 96) + 2;
                    const duration = (7.5 + (i % 5) * 1.4).toFixed(1);
                    const delay = -((i * 1.1) % 7).toFixed(1);
                    const isWhite = i % 2 === 0;

                    dot.style.width = `${size}px`;
                    dot.style.height = `${size}px`;
                    dot.style.left = `${leftPercent}%`;
                    dot.style.background = isWhite
                        ? 'rgba(255, 255, 255, 0.85)'
                        : 'rgba(239, 68, 68, 0.85)';
                    dot.style.boxShadow = isWhite
                        ? '0 0 8px rgba(255, 255, 255, 0.65)'
                        : '0 0 8px rgba(239, 68, 68, 0.6)';
                    dot.style.animationDuration = `${duration}s`;
                    dot.style.animationDelay = `${delay}s`;

                    particlesContainer.appendChild(dot);
                }
            }

            // Update active styling on topic pills
            function setActiveTopic(topic) {
                selectedTopic = topic;
                activeTopicLabel.textContent = topic;

                topicPills.forEach((pill) => {
                    const isSelected = pill.dataset.topic === topic;
                    pill.classList.toggle('pill-selected', isSelected);
                    pill.classList.toggle('bg-white', isSelected);
                    pill.classList.toggle('text-obsidian', isSelected);
                    pill.classList.toggle('border-white', isSelected);
                    pill.classList.toggle('bg-surface', !isSelected);
                    pill.classList.toggle('text-zinc-200', !isSelected);
                    pill.classList.toggle('border-white/10', !isSelected);
                });
            }

            // Wire event listeners for topic pills and action buttons
            function bindEvents() {
                topicPills.forEach((pill) => {
                    pill.addEventListener('click', () => {
                        const topic = pill.dataset.topic || 'All Around The World';
                        setActiveTopic(topic);
                        renderNewPrompt();
                    });
                });

                randomizeBtn.addEventListener('click', () => {
                    renderNewPrompt();
                    showStatus(`Randomized: ${selectedTopic}`);
                });

                copyPromptBtn.addEventListener('click', () => {
                    const currentPrompt = promptTextEl.textContent || '';
                    copyToClipboard(currentPrompt, (copied) => {
                        showStatus(copied ? 'Prompt copied to clipboard.' : 'Select text to copy.');
                    });
                });

                copyAndOpenFlowBtn.addEventListener('click', () => {
                    const currentPrompt = promptTextEl.textContent || '';
                    copyToClipboard(currentPrompt, () => {
                        showStatus('Copied. Opening Google Flow...');
                        window.open(GOOGLE_FLOW_URL, '_blank', 'noopener,noreferrer');
                    });
                });
            }

            // Run launch loading screen smoothly then reveal main app
            function runLoadingSequence() {
                const steps = [
                    { pct: 22, label: 'Tuning luminous white glow...' },
                    { pct: 50, label: 'Calibrating Google Flow engine...' },
                    { pct: 78, label: 'Loading town & world scenes...' },
                    { pct: 100, label: 'RobloxFlow ready.' }
                ];

                let idx = 0;
                const interval = setInterval(() => {
                    if (idx < steps.length) {
                        const step = steps[idx];
                        loaderBarFill.style.width = `${step.pct}%`;
                        loaderPercentText.textContent = `${step.pct}%`;
                        loaderStatusText.textContent = step.label;
                        idx++;
                    } else {
                        clearInterval(interval);
                        setTimeout(() => {
                            loadingScreen.style.opacity = '0';
                            mainApp.style.opacity = '1';
                            setTimeout(() => {
                                loadingScreen.classList.add('hidden');
                            }, 700);
                        }, 240);
                    }
                }, 520);
            }

            // Boot application
            initParticles();
            bindEvents();
            renderNewPrompt();
            runLoadingSequence();
        })();
    </script>
</body>
</html>
